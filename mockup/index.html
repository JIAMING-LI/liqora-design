const pairLogos=p=>`<span class="pair-logos" aria-hidden="true">${logo(p.base)}${logo('USDG')}</span>`;

const sampleWallet='0x71C7000000000000000000000000000000004F2a';
const demoPairs=[{base:'SPY',price:500},{base:'ETH',price:2500},{base:'NVDA',price:180},{base:'CRCL',price:120}];
const pairName=p=>p.base+' / USDG';
const positions=[
  {id:'204801',pool:'0x'+'11'.repeat(32),initial:10000,input:10000,withdraw:0,value:10200,holdings:[5000,5200],feeValues:[20,20],unclaimed:40,collected:60,gas:5,hours:240,date:'Aug 31, 2026 · 14:20',status:'In range',low:480,high:530,fees:{'1h':1,'24h':10,'7d':40},average:10000},
  {id:'204802',pool:'0x'+'22'.repeat(32),initial:5000,input:6040,withdraw:500,value:5370,holdings:[5370,0],feeValues:[10,0],unclaimed:10,collected:60,gas:4,hours:8,date:'Sep 10, 2026 · 06:20',status:'Below range',low:520,high:560,fees:{'1h':0},average:5370},
  {id:'204803',pool:'0x'+'33'.repeat(32),initial:7500,input:7500,withdraw:0,value:7680,holdings:[3600,4080],feeValues:[15,15],unclaimed:30,collected:45,gas:4,hours:120,date:'Sep 5, 2026 · 14:20',status:'In range',low:490,high:540,fees:{'1h':.6,'24h':6},average:7500,initialValues:[3750,3750],previous:{value:7650,unclaimed:25,fees:70,pnl:216,apr:{'1h':65.7,'24h':26.28}}},
  {id:'204804',pool:'0x'+'44'.repeat(32),initial:3000,input:3000,withdraw:0,value:2870,holdings:[0,2870],feeValues:[0,12],unclaimed:12,collected:18,gas:3,hours:480,date:'Aug 21, 2026 · 14:20',status:'Above range',low:430,high:480,fees:{'1h':.1,'24h':2,'7d':14},average:3000,initialValues:[0,3000],previous:{value:2880,unclaimed:10,fees:28,pnl:-95,apr:{'1h':26.28,'24h':21.9,'7d':21.9}}}
].map((p,i)=>({...p,...demoPairs[i],low:p.low*demoPairs[i].price/500,high:p.high*demoPairs[i].price/500}));
// Closed cycles are separate records even when the NFT has since been reopened.
const closedPositions=[
  {id:'204801',initial:8000,withdraw:8200,collected:120,gas:6,hours:240,date:'Aug 1, 2026 · 14:20',closedAt:'2026-08-11T14:20:00+08:00',fees:{'1h':.5,'24h':12,'7d':84}},
  {id:'203902',initial:5000,withdraw:4800,collected:150,gas:6,hours:96,date:'Sep 4, 2026 · 14:20',closedAt:'2026-09-08T14:20:00+08:00',fees:{'1h':1,'24h':35}},
  {id:'203903',initial:12000,withdraw:12500,collected:240,gas:8,hours:336,date:'Aug 26, 2026 · 14:20',closedAt:'2026-09-09T14:20:00+08:00',fees:{'1h':.8,'24h':18,'7d':126}},
  {id:'203904',initial:3000,withdraw:2850,collected:80,gas:5,hours:960,date:'Jul 29, 2026 · 14:20',closedAt:'2026-09-07T14:20:00+08:00',fees:{'1h':.1,'24h':2,'7d':14,'30d':60}}
].map((p,i)=>({...p,...demoPairs[i],pool:i===0?positions[0].pool:'0x'+String(i+5).repeat(64),input:p.initial,initialValues:[p.initial/2,p.initial/2],value:0,holdings:[0,0],feeValues:[0,0],unclaimed:0,status:'Closed',low:(480+i*10)*demoPairs[i].price/500,high:(530+i*10)*demoPairs[i].price/500,average:p.initial,closingPrice:demoPairs[i].price}));

let toastTimer,modalTrigger,pendingAllocation=false;

const preparationHash=(p=allPositions[state.index])=>'0x'+({SPY:'ab',ETH:'ac',NVDA:'ad',CRCL:'ae'}[p.base]).repeat(32);

const amount=n=>'$'+money(n);
const signedAmount=n=>(n>=0?'+':'−')+'$'+money(Math.abs(n));

const periodHours={'1h':1,'24h':24,'7d':168,'30d':720};

  if(previous===undefined||current===undefined)return '<p class="metric-note muted">Change unavailable</p>';

  ${tokenTable('Assets by token',[
    ['Position value',amount(p.value),'Excludes uncollected fees',p.holdings,quantities(p.holdings)],
    ['Initial deposit',incomplete?'—':amount(p.initial),incomplete?'Historical price unavailable':'Valued at creation',incomplete?[]:initialValues,quantities(initialValues)],
    ['Total deposits',incomplete?'—':amount(p.input),'Includes reinvested fees',incomplete?[]:[0,1].map(i=>activityRows(p).filter(row=>row.type==='Deposit').reduce((sum,row)=>sum+row.values[i],0))],
    ['Principal withdrawn',amount(p.withdraw),'Valued at withdrawal',p.closedAt?[p.withdraw/2,p.withdraw/2]:[0,p.withdraw],quantities(p.closedAt?[p.withdraw/2,p.withdraw/2]:[0,p.withdraw])]
  ])}
  ${statement('PnL / total deposits',ratio(p),'Not annualized','','pnl-ratio',incomplete?'muted':shownProfit(p)>=0?'positive':'negative')}
  <div class="formula-box">PnL = position value + uncollected + collected + principal withdrawn − total deposits − LP gas${adjusted()?'<br>Adjusted PnL = PnL − linked preparation costs':''}</div>
  <details class="formula"><summary>Calculation & window details</summary><p>${incomplete?'Historical deposit price unavailable.':`${amount(p.value)} + ${amount(p.unclaimed)} + ${amount(p.collected)} + ${amount(p.withdraw)} − ${amount(p.input)} − ${amount(p.gas)} = ${signedAmount(profit(p))}`}</p><p>Fee APR = fees earned ÷ time-weighted capital × 365 ÷ window days. Current window: ${w}, ending ${p.closedAt?cycleEnd(p):"Sep 10, 2026, 14:20 UTC+8"}. Gas and preparation costs are excluded.</p><p>NFT transfers do not restart the LP cycle.${p.closedAt?" This closed cycle is separate from any later deposit into the same NFT.":""}</p></details></div></section></div>${activity(p)}`;
}
function activityRows(p){
  const poolPrice=p.price;
  if(p.closedAt){
    const index=closedPositions.indexOf(p),end=cycleEnd(p),values=[p.withdraw/2,p.withdraw/2];
    return [
      {time:end,date:end,type:'Withdraw',symbol:'external',qty:values.map((v,i)=>v/(i?quotePrice:p.closingPrice)),values,value:p.withdraw,gas:p.gas-2,hash:String(index+5)+'1',note:'All liquidity withdrawn · cycle closed'},
      {time:end,date:end,type:'Collect',symbol:'external',qty:[0,p.collected/quotePrice],values:[0,p.collected],value:p.collected,gas:0,hash:String(index+5)+'1',note:'Same transaction · gas counted with Withdraw'},
      {time:p.date+' UTC+8',date:p.date+' UTC+8',type:'Deposit',symbol:'wallet',qty:p.initialValues.map((v,i)=>-v/(i?quotePrice:poolPrice)),values:p.initialValues,value:-p.input,gas:2,hash:String(index+5)+'2'}
    ];
  }
  if(p.initialValues){
    const collected=p.closedAt||p.status==='Above range'?[0,p.collected]:[p.collected,0],index=positions.indexOf(p);
    return [
      {time:'1 day ago',date:'Sep 9, 2026 · 12:08 UTC+8',type:'Collect',symbol:'external',qty:collected.map((v,i)=>v/(i?quotePrice:poolPrice)),values:collected,value:p.collected,gas:1,hash:String(index+3)+'1'},
      {time:Math.floor(p.hours/24)+' days ago',date:p.date+' UTC+8',type:'Deposit',symbol:'wallet',qty:p.initialValues.map((v,i)=>-v/(i?quotePrice:poolPrice)),values:p.initialValues,value:-p.initial,gas:p.gas-1,hash:String(index+3)+'2'}
    ];
  }
  return p===positions[0]?[
  {time:'1 day ago',date:'Sep 9, 2026 · 12:08 UTC+8',type:'Collect',symbol:'external',qty:[.12,0],values:[60,0],value:60,gas:2,hash:'31'},
  {time:'10 days ago',date:'Aug 31, 2026 · 14:20 UTC+8',type:'Deposit',symbol:'wallet',qty:[-10,-5050.505051],values:[5000,5000],value:-10000,gas:3,hash:'32'}
]:[
  {time:'2 hours ago',date:'Sep 10, 2026 · 12:08 UTC+8',type:'Withdraw',symbol:'external',qty:[0,500/quotePrice],values:[0,500],value:500,gas:1,hash:'41',note:'Partial withdrawal'},
  {time:'2 hours ago',date:'Sep 10, 2026 · 12:08 UTC+8',type:'Collect',symbol:'external',qty:[20/p.price,0],values:[20,0],value:20,gas:0,hash:'41',note:'Same transaction · gas counted with Withdraw'},
  {time:'4 hours ago',date:'Sep 10, 2026 · 10:00 UTC+8',type:'Deposit',symbol:'wallet',qty:[-40/p.price,0],values:[40,0],value:-40,gas:0,hash:'42',note:'Collected fees reinvested · gas counted with Collect'},
  {time:'4 hours ago',date:'Sep 10, 2026 · 10:00 UTC+8',type:'Collect',symbol:'external',qty:[40/p.price,0],values:[40,0],value:40,gas:1,hash:'42',note:'Fees collected and reinvested'},
  {time:'6 hours ago',date:'Sep 10, 2026 · 08:00 UTC+8',type:'Deposit',symbol:'wallet',qty:[0,-1010.101010],values:[0,1000],value:-1000,gas:1,hash:'43'},
  {time:'8 hours ago',date:'Sep 10, 2026 · 06:20 UTC+8',type:'Deposit',symbol:'wallet',qty:[0,-5050.505051],values:[0,5000],value:-5000,gas:1,hash:'44'}
]}
// Six colors repeat for longer histories; the hash identifies the transaction.
const transactionColors=[['#3674B5','#FFFFFF'],['#E9BE5F','#282823'],['#595C56','#FFFFFF'],['#F5F0CD','#282823'],['#578FCA','#18232D'],['#282823','#FFFFFF']];
const transactionHashes=[...new Set([...allPositions.flatMap(activityRows).map(row=>row.hash),...allPositions.map(p=>preparationHash(p).slice(2,4))])].sort();
function displayedActivityRows(p){
  const rows=activityRows(p),quantity=state.alloc[allPositions.indexOf(p)];
  // ponytail: the source fixture predates every demo LP; sort by block time when using live events.
  if(state.verified&&quantity>0)rows.push({type:'Swap',symbol:'refresh',hash:preparationHash(p).slice(2,4),date:preparationDate,time:preparationDate,qty:[10,-(10*p.price+30)/quotePrice],values:[10*p.price,10*p.price+30],gas:2,value:prep(p),share:quantity/10,allocatedFee:quantity*3,allocatedGas:quantity*.2});
  return rows;
}
function activity(p){
  const contract='0x'+'58'.repeat(20);
  return `<section class="section panel history-panel"><div class="statement-head"><h2>Recent activity</h2><span>${state.verified&&prep(p)>0?'LP + linked preparation':'LP cycle'} · Sample transactions</span></div><table class="plain-table activity-table"><thead><tr><th>Txn Hash</th><th>Type</th><th>Balance</th><th>Total Value</th><th>Tx fee</th></tr></thead><tbody>${displayedActivityRows(p).map(row=>{const unavailable=missing(p)&&row.hash==='44',[bg,ink]=transactionColors[transactionHashes.indexOf(row.hash)%transactionColors.length],swap=row.type==='Swap',rowContract=swap?'0x'+'59'.repeat(20):contract;return `<tr data-activity-type="${row.type}"><td><button class="txn-tag num" style="--txn-bg:${bg};--txn-ink:${ink}" data-action="hash" data-hash="${'0x'+row.hash.repeat(32)}" title="${'0x'+row.hash.repeat(32)}" aria-label="View sample transaction ${'0x'+row.hash.repeat(32)}">Txn ${short('0x'+row.hash.repeat(32))}${icon('external')}</button><div class="activity-time">${logo('robinhood','round')}<time title="${row.date}">${row.time}</time></div></td><td><span class="history-type">${icon(row.symbol)}${row.type}</span>${swap?'<span class="tag linked-preparation">Linked preparation</span>':''}<button class="text-btn history-contract" data-action="contract" data-contract="${rowContract}" aria-label="View sample contract address">contract ${short(rowContract)} ${icon('external')}</button></td><td class="history-balance">${tokenDetails(unavailable?[undefined,undefined]:row.values,row.qty,p)}</td><td class="num history-total">${swap?amount(row.value):unavailable?'—':signedAmount(row.value)}${swap?`<div class="cell-sub">Linked costs · ${money(row.share*100)}%<br>Swap ${amount(row.allocatedFee)} + gas ${amount(row.allocatedGas)}</div>`:''}${row.note?`<div class="cell-sub">${row.note}</div>`:''}</td><td><span class="num gas-token">${logo('ETH')}${(row.gas/2500).toFixed(8)} ETH</span><div class="cell-sub fee-fiat">${icon('wallet')}${amount(row.gas)}</div>${swap?'<div class="cell-sub">Source gas<br>Source swap fee $30.00</div>':''}</td></tr>`}).join('')}</tbody></table></section>`;
}
function queryPage(){return `<section class="panel intro"><div class="eyebrow">A clear view of your liquidity</div><h1>View your LP positions</h1><p class="muted">Enter a wallet address to view public LP data. No signature needed.</p><form id="query-form" novalidate><div class="field"><label for="address">Wallet address</label><input class="input num" id="address" placeholder="0x…" required aria-describedby="address-error"><div id="address-error" class="error" role="alert"></div></div><div class="flex"><button class="btn primary">View positions ${icon('arrow')}</button><button class="btn" type="button" data-action="sample">Use demo wallet</button></div></form><p class="cell-sub" style="margin-top:22px">This prototype supports one demo wallet only. Other addresses are not queried. Sample pairs: SPY / USDG, ETH / USDG, NVDA / USDG and CRCL / USDG on Robinhood Chain, Uniswap V4.</p></section>`}
function modal(title,body,allocation=false){
  if(!dialog.open)modalTrigger=document.activeElement;
  else dialog.close();
  dialog.className='modal'+(allocation?' allocation-modal':'');
  dialog.innerHTML=`<div class="modal-head"><h2 id="dialog-title">${title}</h2><button class="close" data-action="close" aria-label="Close panel">${icon('close')}</button></div><div class="modal-body">${body}</div>`;
  dialog.showModal();
}
function closeModal(){dialog.close();dialog.innerHTML='';pendingAllocation=false;if(modalTrigger?.isConnected&&modalTrigger!==document.body)modalTrigger.focus();else (app.querySelector('[data-action="allocate"]')||app.querySelector('button'))?.focus()}
function verify(){modal('Verify wallet',`<div class="badge-icon">${icon('shield')}</div><h3 style="margin-top:18px">Your private preparation costs</h3><p style="margin-top:12px">Verify control of the queried wallet to manage its preparation costs. A signature does not send a transaction or authorize assets.</p><div class="source-code">${sampleWallet}</div><p style="margin-top:18px">This prototype simulates verification. No wallet connection or real signature is requested.</p><div class="modal-actions"><button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="verified">Simulate verification</button></div>`)}
function allocationPanel(){
  if(!state.verified){pendingAllocation=true;verify();return}
  modal('Link preparation costs',`<div class="allocation-context"><div class="pair-heading">${pairLogos(allPositions[state.index])}<div><span class="pair-title">${pairName(allPositions[state.index])}</span><div class="cell-sub">NFT #${allPositions[state.index].id} · Opened ${allPositions[state.index].date} UTC+8</div></div></div><span class="tag">${icon('shield')}Private</span></div><div class="steps" aria-label="Preparation cost steps"><span class="active" data-step="1">01 Find transaction</span>${icon('chevron')}<span data-step="2">02 Allocate costs</span></div><form id="hash-form" novalidate><div class="field"><label for="tx-hash">Transaction hash</label><input id="tx-hash" class="input hash-input" placeholder="0x…" required aria-describedby="hash-help hash-error"><p id="hash-help">Link the swap used to prepare tokens for this LP on Robinhood Chain. This demo supports the sample transaction only.</p><div id="hash-error" class="error" role="alert"></div></div><div class="between"><button type="button" class="text-btn" data-action="sample-hash">Use sample hash</button><button class="btn primary" id="parse-tx">Parse transaction</button></div></form><div id="parsed-transaction"></div>`,true);
  if(state.alloc[state.index]){document.querySelector('#tx-hash').value=preparationHash();parseTransaction()}
  else document.querySelector('#tx-hash').focus();
}
function parseTransaction(){
  const p=allPositions[state.index];
  const input=document.querySelector('#tx-hash'),hash=input.value.trim().toLowerCase(),error=document.querySelector('#hash-error');
  error.textContent='';document.querySelector('#parsed-transaction').innerHTML='';
  if(!/^0x[0-9a-f]{64}$/.test(hash)){error.textContent='Enter a transaction hash starting with 0x followed by 64 hexadecimal characters.';input.focus();return}
  if(hash!==preparationHash()){error.textContent='Only the sample hash is supported. This prototype does not parse live transactions.';input.focus();return}
  document.querySelector('#hash-form').hidden=true;
  document.querySelector('[data-step="1"]').classList.remove('active');document.querySelector('[data-step="2"]').classList.add('active');
  const q=state.alloc[state.index]||Math.min(6,allocationAvailable());
  document.querySelector('#parsed-transaction').innerHTML=`<div class="between"><span class="num small">${short(preparationHash())} · Sample transaction</span><button type="button" class="text-btn" data-action="change-hash">Change transaction</button></div><form id="allocation-form" novalidate><div class="allocation-grid"><div class="parsed-result"><div class="between"><h3>Source transaction</h3><span class="tag green">Demo result</span></div><p class="cell-sub">${preparationDate} · Demo wallet</p>${line('Paid',new Intl.NumberFormat('en-US',{maximumFractionDigits:6}).format((10*p.price+30)/quotePrice)+' USDG')}${line('Received','10 '+p.base)}${line('Swap fee (LP $25 + protocol $5)','$30.00')}${line('Source transaction gas','$2.00')}<p>Costs use their transaction-time value. Components of the total swap fee are not counted twice.</p></div><div class="allocation-entry"><div class="field"><div class="between"><label for="quantity">Amount used for this LP</label><button type="button" class="text-btn" data-action="all">Use all remaining</button></div><div class="qty-wrap"><input id="quantity" class="input" type="number" step="0.000001" min="0.000001" max="${allocationAvailable()}" value="${q||''}" required aria-describedby="qty-help qty-error"><span>${p.base}</span></div><p id="qty-help">Received 10 ${p.base} · Available to this allocation: ${allocationAvailable()} ${p.base}</p><div id="qty-error" class="error" role="alert"></div></div><div class="allocation-preview"><div class="between"><h3>Allocation preview</h3><span class="tag amber">Not saved</span></div>${line('Allocation share','<span id="ratio"></span>')}${line('Allocated swap fee','<span id="allocated-fee"></span>')}${line('Allocated gas','<span id="allocated-gas"></span>')}${line('Total linked costs','<strong id="allocated-total"></strong>')}${line('PnL',missing(allPositions[state.index])?'Unavailable':signedAmount(profit(allPositions[state.index])))}${line('Adjusted PnL after saving','<strong id="preview-pnl"></strong>')}</div></div></div><p class="allocation-note">Saving replaces this LP’s linked costs and updates Adjusted PnL. Deposits and Fee APR stay unchanged. Demo records last for this session.</p><div id="save-error" class="error" role="alert"></div><div class="modal-actions"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary" id="save-allocation">Save allocation</button></div></form>`;
  updatePreview();document.querySelector('#quantity').focus();
}
function updatePreview(){
  const input=document.querySelector('#quantity'),q=Number(input.value),max=allocationAvailable();
  const valid=input.value!==''&&Number.isFinite(q)&&q>0&&q<=max&&!input.validity.stepMismatch;
  document.querySelector('#qty-error').textContent=valid?'':`Enter more than 0 and no more than ${max} ${allPositions[state.index].base} (up to 6 decimal places in this demo).`;
  document.querySelector('#save-allocation').disabled=!valid;
  const p=allPositions[state.index];
  const values={ratio:money(q*10)+'%','allocated-fee':amount(q*3),'allocated-gas':amount(q*.2),'allocated-total':amount(q*3.2),'preview-pnl':missing(p)?'Unavailable':signedAmount(profit(p)-q*3.2)};
  Object.entries(values).forEach(([id,value])=>document.getElementById(id).textContent=valid?value:'—');
  return valid;
}
function revoke(){
  if(!state.verified)return;
  modal('Remove preparation cost allocation',`<p>Removing this allocation releases its quantity and removes its preparation costs. Public LP data stays unchanged.</p><div class="modal-actions"><button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="confirm-revoke">Remove allocation</button></div>`);
}
function refresh(){
  if(state.refreshing)return;
  state.refreshing=true;
  document.querySelectorAll('[data-action="refresh"]').forEach(el=>{el.disabled=true;el.innerHTML=icon('refresh')});
  setTimeout(()=>{state.refreshing=false;document.querySelectorAll('[data-action="refresh"]').forEach(el=>{el.disabled=false;el.innerHTML=icon('refresh')});toast(state.scenario==='stale'?'Refresh failed. The previous snapshot and timestamp are unchanged.':'Demo refreshed. The fixed snapshot is still Sep 10, 2026, 14:20:00 UTC+8.')},500);
}
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button){const row=event.target.closest('[data-position-index]');if(row){state.page='detail';state.index=Number(row.dataset.positionIndex);render();window.scrollTo(0,0)}return}
  const action=button.dataset.action;
  if(action==='filter'){state.filter=button.dataset.filter;render();document.querySelector('#tab-'+state.filter).focus()}
  else if(action==='home'){state.page='home';render();window.scrollTo(0,0)}
  else if(action==='detail'){state.page='detail';state.index=Number(button.dataset.index);render();window.scrollTo(0,0)}
  else if(action==='mode'){state.mode=button.dataset.mode;render();app.querySelector(`[data-mode="${state.mode}"]`)?.focus()}
  else if(action==='period'){state.period=button.dataset.period;render();document.querySelector(`[data-period="${state.period}"]`).focus({preventScroll:true})}
  else if(action==='close')closeModal();
  else if(action==='verify'){pendingAllocation=false;verify()}
  else if(action==='verified'){const continueAllocation=pendingAllocation;state.verified=true;state.mode='base';closeModal();render();if(continueAllocation)allocationPanel();else{app.querySelector('[data-action="disconnect"],button')?.focus();toast('Demo verification complete. Private records for this wallet are now available.')}}
  else if(action==='disconnect'){state.verified=false;state.mode='base';closeModal();render();toast('Verification disconnected. Private records and adjusted results are hidden.')}
  else if(action==='allocate')allocationPanel();
  else if(action==='sample-hash'){document.querySelector('#tx-hash').value=preparationHash();document.querySelector('#hash-error').textContent='';document.querySelector('#parsed-transaction').innerHTML='';document.querySelector('#parse-tx').focus()}
  else if(action==='change-hash'){document.querySelector('#hash-form').hidden=false;document.querySelector('#parsed-transaction').innerHTML='';document.querySelector('[data-step="1"]').classList.add('active');document.querySelector('[data-step="2"]').classList.remove('active');document.querySelector('#tx-hash').focus()}
  else if(action==='all'){document.querySelector('#quantity').value=allocationAvailable();updatePreview()}
  else if(action==='revoke')revoke();
  else if(action==='confirm-revoke'){if(!state.verified)return;state.alloc[state.index]=0;closeModal();render();app.querySelector('[data-action="allocate"]')?.focus();toast('Demo allocation removed.')}
  else if(action==='contract')modal('Sample contract address',`<p>Illustrative contract for these demo LP operations.</p><div class="source-code">${esc(button.dataset.contract)}</div>`);
  else if(action==='pool')modal('Sample pool ID',`<p>Pool ID for this position. This is a demo record.</p><div class="source-code">${allPositions[state.index].pool}</div>`);
  else if(action==='hash')modal('Sample transaction hash',`<p>This is a sample transaction, not a real explorer record. In the connected product, this link opens the transaction on the chain explorer.</p><div class="source-code">${esc(button.dataset.hash)}</div>`);
  else if(action==='wallet')modal('Queried wallet',`<p>Current query: demo wallet</p><div class="source-code">${sampleWallet}</div><div class="modal-actions"><button class="btn" data-action="query">Change address</button><button class="btn primary" data-action="${state.verified?'disconnect':'verify'}">${state.verified?'Disconnect verification':'Verify wallet'}</button></div>`);
  else if(action==='query'){state.verified=false;state.mode='base';closeModal();state.page='query';render();document.querySelector('#address').focus()}
  else if(action==='sample'){state.verified=false;state.mode='base';state.page='home';state.filter='open';state.scenario='normal';document.querySelector('#scenario').value='normal';render()}
  else if(action==='reset'){state.filter='open';state.scenario='normal';document.querySelector('#scenario').value='normal';render()}
  else if(action==='refresh')refresh();
});
document.addEventListener('keydown',event=>{
  const tab=event.target.closest('[role=tab]');if(!tab)return;
  const keys=positionFilters.map(([key])=>key),i=keys.indexOf(tab.dataset.filter);
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();
  state.filter=keys[event.key==='Home'?0:event.key==='End'?keys.length-1:(i+(event.key==='ArrowRight'?1:-1)+keys.length)%keys.length];
  render();document.querySelector('#tab-'+state.filter).focus();
});
document.addEventListener('input',event=>{
  if(event.target.id==='quantity')updatePreview();
  if(event.target.id==='tx-hash'){document.querySelector('#parsed-transaction').innerHTML='';document.querySelector('#hash-error').textContent=''}
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  if(event.target.id==='hash-form')parseTransaction();
  else if(event.target.id==='allocation-form'){
    if(!state.verified||document.querySelector('#tx-hash').value.trim().toLowerCase()!==preparationHash()||!updatePreview())return;
    if(state.scenario==='save-error'){document.querySelector('#save-error').textContent='Save failed. Your changes have not been saved; the previous record is unchanged. Change the demo state to retry.';return}
    state.alloc[state.index]=Number(document.querySelector('#quantity').value);state.mode='adjusted';closeModal();render();app.querySelector('[data-action="allocate"]').focus();toast('Allocation saved for this demo session. Position details and totals are updated.');
  }else if(event.target.id==='query-form'){
    const input=document.querySelector('#address'),value=input.value.trim(),error=document.querySelector('#address-error');
    if(!/^0x[0-9a-fA-F]{40}$/.test(value)){error.textContent='Enter a valid wallet address: 0x followed by 40 hexadecimal characters.';input.focus();return}
    if(value.toLowerCase()!==sampleWallet.toLowerCase()){error.textContent='Live queries are not connected. Use the demo wallet to view sample data.';input.focus();return}
    state.page='home';state.filter='open';state.verified=false;state.mode='base';render();
  }
});
document.querySelector('#scenario').addEventListener('change',event=>{state.scenario=event.target.value;if(state.scenario==='empty')state.page='home';render()});
dialog.addEventListener('cancel',event=>{event.preventDefault();closeModal()});
setInterval(()=>{if(state.page!=='query')refresh()},60000);
render();
</script>
</body>
</html>
